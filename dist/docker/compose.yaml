# Test environment for http-public (SPEC 5.3, 5.7): Postgres, Keycloak, the app and, with --profile proxy, a Caddy
# TLS proxy. All values come from .env (generated by setup.sh); there is no env_file and no default for a secret.
name: imap-mcp-public

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run setup.sh}
      IMAPMCP_DB_PASSWORD: ${IMAPMCP_DB_PASSWORD:?run setup.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run setup.sh}
      KC_HOSTNAME: ${IDP_ORIGIN:?run setup.sh}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.28.0.0/24
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run setup.sh}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
      # placeholders of the realm import (whole JSON string values)
      REALM_MCP_RESOURCE: ${MCP_ORIGIN:?run setup.sh}/mcp
      REALM_WEB_REDIRECT_URI: ${MCP_ORIGIN:?run setup.sh}/accounts/callback
      REALM_WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:?run setup.sh}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r line <&3 && [[ \"$$line\" == *\" 200 \"* ]]"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1280m
    networks: [backend]

  app:
    build:
      context: .
      args:
        JAR_FILE: ${JAR_FILE:-jar/imap-mcp.jar}
    image: localhost/imap-mcp-public:${IMAP_MCP_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      IMAPMCP_DB_PASSWORD: ${IMAPMCP_DB_PASSWORD:?run setup.sh}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:?run setup.sh}
      HANDLE_KEY_1: ${HANDLE_KEY_1:?run setup.sh}
      KEK_1: ${KEK_1:?run setup.sh}
      IMAP_MCP_LOG_LEVEL: ${IMAP_MCP_LOG_LEVEL:-INFO}
      # local variant: the truststore with the local CA; empty in the public variant
      JDK_JAVA_OPTIONS: ${APP_JDK_JAVA_OPTIONS:-}
    volumes:
      - ./app:/config:ro,Z
      - ./truststore:/truststore:ro,Z
      - imap-mcp-logs:/logs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx16m", "-XX:TieredStopAtLevel=1", "-cp", "/app/imap-mcp.jar", "de.alexanderlindhorst.imapmcp.app.HealthProbe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    networks: [backend]

  # TLS proxy (profile proxy): its network aliases make the app's https fetches of discovery and JWKS reach Caddy
  # itself, so they need neither hairpin NAT nor a second resolver.
  caddy:
    image: docker.io/library/caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [proxy]
    restart: unless-stopped
    environment:
      MCP_HOST: ${MCP_HOST:?run setup.sh}
      IDP_HOST: ${IDP_HOST:?run setup.sh}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/${CADDY_SITE:-public}:/etc/caddy:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      backend:
        aliases:
          - ${MCP_HOST:?run setup.sh}
          - ${IDP_HOST:?run setup.sh}

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  imap-mcp-logs:
  caddy-data:
  caddy-config:
