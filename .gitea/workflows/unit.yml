# #461: unit tests only (test phase), no merge-gate evidence. For a slow (ARM) host; the full verify is
# ci/verify.sh. Needs a self-hosted act_runner in host mode with the label below. Every action is pinned by
# commit SHA; no secrets are used.
name: unit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: imap-mcp-unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - run: ci/unit.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-reports
          path: ci-artifacts
          if-no-files-found: ignore
