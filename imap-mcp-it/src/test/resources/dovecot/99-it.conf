# The sibling tls.key/tls.crt are a committed test fixture (self-signed, CN=localhost); see TestTrust.
# Test-only (imap-mcp-it). The 2.4.5 image already creates Drafts, Junk, Sent and Trash with SPECIAL-USE;
# only \Archive is missing. Dovecot 2.4 syntax: "mailbox" blocks inside "namespace", settings use "special_use"/"auto".
namespace inbox {
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
