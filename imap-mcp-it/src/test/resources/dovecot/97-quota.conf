# Test-only (imap-mcp-it), optional [OVERQUOTA] fixture (#207, SPEC 5.8): a small per-user storage quota, so a COPY of
# a larger seeded message is refused with NO [OVERQUOTA]. Dovecot 2.4 syntax (quota "count" backend by default).
mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota_storage_size = 40k
# Without the grace of 0 the default 10 M lets the quota be exceeded; the (empty) quota block activates the default root.
quota_storage_grace = 0
quota "User quota" {
}
