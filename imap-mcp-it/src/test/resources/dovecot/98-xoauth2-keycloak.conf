# Test-only (imap-mcp-it), #500 X1-3: as 98-xoauth2.conf, but for access tokens issued by Keycloak. The issuer is the one
# Keycloak puts into its tokens (derived from the request host, so DovecotOauth2Container fills it in at run time), the
# user is the e-mail claim, and the realm's public key is copied in by the test after Keycloak is up (no key in the
# repository), stored below <azp>/RS256/<kid>.
auth_mechanisms {
  plain = yes
  login = yes
  xoauth2 = yes
}
auth_failure_delay = 0
oauth2_introspection_mode = local
oauth2_issuers = @ISSUER@
oauth2_username_attribute = email
oauth2_token_expire_grace = 0
passdb oauth2 {
  driver = oauth2
}
oauth2_local_validation {
  dict fs {
    fs posix {
      fs_posix_prefix = /etc/dovecot/keys/
    }
  }
}
