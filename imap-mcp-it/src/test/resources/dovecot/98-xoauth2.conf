# Test-only (imap-mcp-it), #492 X2-0 (SPEC 5.8): XOAUTH2 with local JWT validation. Dovecot 2.4 syntax (spiked on 2.4.5).
# The oauth2 passdb validates the token signature (RS256) against a public key copied in by DovecotOauth2Container, the
# expiry (no grace) and that the token user matches the SASL user. The static passdb of the image stays for PLAIN/LOGIN.
auth_mechanisms {
  plain = yes
  login = yes
  xoauth2 = yes
}
# Failures are answered at once instead of after the default 2 s delay.
auth_failure_delay = 0
oauth2_introspection_mode = local
oauth2_issuers = test-issuer
oauth2_username_attribute = sub
oauth2_token_expire_grace = 0
passdb oauth2 {
  driver = oauth2
}
# Key lookup: <prefix>/<azp or "default">/<alg>/<kid or "default">; the file holds the PEM public key.
oauth2_local_validation {
  dict fs {
    fs posix {
      fs_posix_prefix = /etc/dovecot/keys/
    }
  }
}
